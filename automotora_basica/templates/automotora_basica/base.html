{% load static %}
<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{% block title %}Automotora{% endblock %} | Inventario</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'automotora_basica/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'automotora_basica/automotora.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="wordmark" href="{% url 'automotora_basica:vehiculo_list' %}" aria-label="Automotora, ir al inventario">
            <span class="wordmark__mark" aria-hidden="true">A</span>
            <span>Automotora</span>
        </a>
        <nav class="site-nav" aria-label="Navegación principal">
            <a class="site-nav__link" href="{% url 'automotora_basica:vehiculo_list' %}">Inventario</a>
            <a class="button button--primary site-nav__action" href="{% url 'automotora_basica:vehiculo_create' %}">Agregar vehículo</a>
        </nav>
    </header>
    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <span>Gestión de inventario</span>
        <span>Automotora · Vehículos</span>
    </footer>
</body>
</html>
