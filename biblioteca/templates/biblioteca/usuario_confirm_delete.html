<!DOCTYPE html>
<html lang="es">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar Usuario - Biblioteca</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
      body {
        background-color: #f4f6f9;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      .card-confirm {
        border: none;
        border-radius: 1rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      }
    </style>
  </head>

  <body class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card card-confirm p-4 p-md-5 text-center bg-white">
            <div class="rounded-circle bg-danger bg-opacity-10 text-danger p-3 mx-auto mb-3" style="width: 70px; height: 70px;">
              <i class="bi bi-exclamation-triangle-fill fs-2"></i>
            </div>

            <h3 class="fw-bold text-dark mb-2">¿Eliminar Usuario?</h3>
            <p class="text-muted mb-4">
              Estás a punto de eliminar a <strong>{{ usuario.nombre_completo }}</strong> (RUT: {{ usuario.rut }}).
              Esta acción no se puede deshacer.
            </p>

            <form method="POST">
              {% csrf_token %}
              <div class="d-flex justify-content-center gap-2">
                <a href="{% url 'usuario_listar' %}" class="btn btn-light px-4 py-2 border">Cancelar</a>
                <button type="submit" class="btn btn-danger px-4 py-2 fw-semibold">
                  <i class="bi bi-trash me-1"></i> Sí, Eliminar
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"></script>
  </body>

</html>
