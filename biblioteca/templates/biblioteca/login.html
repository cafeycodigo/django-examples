<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión - Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  </head>
  <body class="bg-light d-flex align-items-center min-vh-100 py-5">
    <main class="container">
      <div class="row justify-content-center">
        <div class="col-sm-10 col-md-7 col-lg-5">
          <section class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-4">
                <div class="text-primary fs-1"><i class="bi bi-book-half"></i></div>
                <h1 class="h3 fw-bold">Biblioteca</h1>
                <p class="text-muted mb-0">Ingresa con tu nombre de usuario y contraseña.</p>
              </div>

              {% if error %}
                <div class="alert alert-danger" role="alert">{{ error }}</div>
              {% endif %}

              <form method="post">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next|default:'' }}">
                <div class="mb-3">
                  <label for="id_username" class="form-label fw-semibold">Nombre de usuario</label>
                  <input type="text" name="username" id="id_username" class="form-control form-control-lg"
                         autocomplete="username" autofocus required>
                </div>
                <div class="mb-4">
                  <label for="id_password" class="form-label fw-semibold">Contraseña</label>
                  <input type="password" name="password" id="id_password" class="form-control form-control-lg"
                         autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100">
                  <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión
                </button>
              </form>
              <div class="text-center mt-4">
                <a href="{% url 'index' %}" class="link-secondary text-decoration-none">Volver al panel público</a>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
