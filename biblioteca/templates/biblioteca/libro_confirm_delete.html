<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Eliminar libro - Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  </head>
  <body class="bg-light py-5">
    <main class="container">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
          <section class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5 text-center">
              <div class="text-danger fs-1 mb-2"><i class="bi bi-exclamation-triangle"></i></div>
              <h1 class="h3 fw-bold">¿Eliminar este libro?</h1>
              <p class="text-muted">
                Se eliminará la ficha <strong>{{ libro.titulo }}</strong>.
                Un libro con ejemplares físicos no se puede eliminar.
              </p>
              <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2">
                  <a href="{% url 'libro_detalle' libro.pk %}" class="btn btn-light border">Cancelar</a>
                  <button type="submit" class="btn btn-danger">Sí, eliminar libro</button>
                </div>
              </form>
            </div>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
